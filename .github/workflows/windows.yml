name: Windows CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The release step attaches assets to a draft release, which needs write access
# to contents. The built-in GITHUB_TOKEN covers it; no PAT is involved.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Deliberately no shared `concurrency` group across the three release
    # workflows: GitHub holds only ONE pending run per group, so a third
    # arrival cancels the queued second rather than queueing behind it. See
    # docs/releasing.md for what that means for the draft release.

    # Git Bash is on the runner, so this job drives the same scripts/bundle.sh
    # the other two do rather than needing a PowerShell translation of it.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cmd/version.go | head -1)
          test -n "$APP_VERSION" || { echo "could not extract Version from cmd/version.go" >&2; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build and bundle
        env:
          CGO_ENABLED: "0"
        run: ./scripts/bundle.sh windows

      - name: Checksum
        run: |
          cd dist
          sha256sum "emule-http-cache-${APP_VERSION}-win64.tar.gz" \
            > "emule-http-cache-${APP_VERSION}-win64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: emule-http-cache-${{ env.APP_VERSION }}-win64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      # Only on a tag: a workflow_dispatch run on a branch still produces the
      # artifact above, but has no release to attach it to.
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
